
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página web</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background-color: white;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 30px;
    }

    img {
      display: block;
      width: 100%;
      max-width: 1100px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <h1>Gregorio Arranz</h1>

  <img src="foto.jpg" alt="Imagen principal">

</body>
</html>
